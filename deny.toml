# cargo-deny policy. Run from the repository root:
#   cargo deny check            (advisories, bans, licenses, sources)
# Advisories are also checked with `cargo audit`.

[graph]
# Platform-specific dependencies are checked for the release targets only.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
version = 2
# A yanked crate in Cargo.lock fails the check.
yanked = "deny"
# Only unmaintained crates that the workspace depends on directly fail.
unmaintained = "workspace"
# Policy: an advisory is ignored only when it has an ID, a reason, and a link,
# and only when no fixed version exists and the affected code path is not
# reachable from this project. Keep this list empty unless all three hold.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Only the licenses that the dependency tree uses are allowed. Licenses that
# appear in the tree only as an unused alternative of an `OR` expression
# (for example BSD-1-Clause, LGPL-2.1-or-later, MIT-0, Unlicense) are not
# listed, because the chosen alternative is already allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Workspace crates (path dependencies) are not published, so their license
# is not checked.
[licenses.private]
ignore = true

[bans]
# Duplicate versions of a crate are reported but do not fail the check.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace may use wildcard versions.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
