name: Release

# Builds the agora CLI for macOS (arm64, x86_64) and Linux (x86_64).
#
# - Tag push `v*`: every target is built and packaged, then the publish job
#   creates a DRAFT GitHub release with the archives and SHA256SUMS. The owner
#   reviews the draft and publishes it by hand in the GitHub UI. This workflow
#   never publishes a release. The draft must only be published after CI is
#   green on the tagged commit.
# - workflow_dispatch: every target is built and the archives are uploaded as
#   workflow artifacts only. The version is `dev-<7-char sha>`. Nothing is
#   published.
#
# Builds take several minutes per target: the release profile in Cargo.toml
# uses lto = "fat", codegen-units = 1 and strip = true, so the link step is long.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the publish job asks for contents: write.
permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: agora-macos-arm64
          # Cross-compiled on the arm64 runner. The `targets` input below adds
          # the x86_64 standard library. The cc crate drives Apple clang with
          # the x86_64 target to build the bundled SQLite.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: agora-macos-x86_64
          # ubuntu-22.04, not ubuntu-latest: a binary built on 24.04 needs
          # GLIBC_2.38 or newer and fails on older distros with
          # "GLIBC_2.xx not found". Building on 22.04 lowers the glibc floor.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: agora-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches Cargo version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo_ver=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="agora"))')
          [ "v$cargo_ver" = "$TAG" ] || { echo "tag $TAG != Cargo version $cargo_ver"; exit 1; }

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p agora --target ${{ matrix.target }}

      - name: Verify architecture
        if: runner.os == 'macOS'
        run: lipo -archs "target/${{ matrix.target }}/release/agora" | grep -qx "${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}"

      - name: Package and checksum
        id: package
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.value }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          stage="${NAME}-${VERSION}"
          archive="${stage}.tar.gz"
          mkdir "$stage"
          cp "target/${TARGET}/release/agora" LICENSE README.md "$stage/"
          tar -czf "$archive" "$stage"
          if [ "$RUNNER_OS_NAME" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Assumption: download-artifact v7 is the release line that pairs with
      # upload-artifact v7 (same major, both on Node 24). The v7 tag exists.
      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: agora-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: cat ./*.sha256 > SHA256SUMS

      # Creates a draft. The owner publishes it manually after review.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
