name: Legacy

# The TypeScript app under legacy/ is superseded by Agora (Rust). This workflow
# only guards the legacy plugin and relay from breaking while they are still
# deployed. It runs on changes under legacy/ and on manual dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "legacy/**"
      - ".github/workflows/legacy.yml"

permissions:
  contents: read

jobs:
  legacy-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
