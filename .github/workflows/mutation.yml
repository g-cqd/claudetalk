name: Mutation

# cargo-mutants over the Rust core crates. This replaces the Stryker run over
# the TypeScript app, which now lives under legacy/ and is no longer mutated.
# Results are informational: the job is non-blocking, and each crate uploads
# its mutants.out directory as an artifact.
#   - nightly cron (low priority, runs against main)
#   - manual trigger when you want a fresh report
#   - PR opt-in via the `run-mutation` label. The label triggers one run at
#     label time only; later pushes need the label re-applied or a manual
#     dispatch.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-mutation'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate: [agora-core, agora-sched, agora-store]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        run: cargo mutants --package ${{ matrix.crate }} --timeout-multiplier 3 --no-shuffle -vV --cargo-arg=--locked
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 30
