version: 2
updates:
  # Rust workspace: root Cargo.toml and crates/*
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
    groups:
      # Group minor/patch bumps to reduce PR noise
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Legacy TypeScript app (retired, still deployed). Uses bun.lock only; CI runs
  # `bun install --frozen-lockfile`, so updates must go through bun, not npm.
  # Monthly, and only a few open PRs at a time; security updates still arrive
  # through this entry. legacy/relay has no dependencies of its own.
  - package-ecosystem: "bun"
    directory: "/legacy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "legacy"
    commit-message:
      prefix: "deps"
