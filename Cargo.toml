[workspace]
resolver = "3"
members = [
    "crates/agora-core",
    "crates/agora-store",
    "crates/agora-cli",
    "crates/agora-client",
    "crates/agora-mcp",
    "crates/agora-crypto",
    "crates/agora-deliver",
    "crates/agora-proto",
    "crates/agora-daemon",
    "crates/agora-hooks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hkdf = "0.12"
libc = "0.2"
tempfile = "3"
assert_cmd = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
schemars = "1"
tokio-stream = "0.1"
# dev only (agora-mcp tests)
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# panic = "unwind" (default): the daemon isolates a panicking request (catch_unwind / JoinError) instead of dying.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
