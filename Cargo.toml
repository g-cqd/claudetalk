[workspace]
resolver = "3"
members = ["crates/agora-core", "crates/agora-store", "crates/agora-cli", "crates/agora-crypto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
